name = "missed-call-agent"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Every 10 minutes: retry failed owner alerts.
# Every day at 13:00 UTC (9 am New York): send you the daily summary.
[triggers]
crons = ["*/10 * * * *", "0 13 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "missed-call-agent"
database_id = "2a541dc4-198b-4f53-a00f-a4142ee3bede"

# Non-secret settings. Secrets go in with `npx wrangler secret put NAME` (see RUN-GUIDE.md).
[vars]
# OPERATOR_WHATSAPP (your own WhatsApp) is a secret, so it stays off GitHub.
SEND_LIVE = "true"               # "true" = really send WhatsApp/SMS. "false" = log only.
TWILIO_WHATSAPP_FROM = "whatsapp:+14155238886"      # whatsapp:+14155238886 (sandbox) or your approved sender
TWILIO_SMS_FROM = ""             # +1... Twilio number for the SMS backup
WHATSAPP_TEMPLATE_SID = ""       # HX... approved lead-alert template (needed for real clients)
VAPI_MODEL = "gpt-4o-mini"
VAPI_VOICE = "Elliot"            # Vapi voice id. Must be set: with no voice the agent cannot speak.
